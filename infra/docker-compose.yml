# bank-statement-analizer — Compose v2 (no top-level "version:" key).
# Project name: bsa  (set here so all resources get a consistent prefix)
#
# Usage (local):
#   docker compose --env-file .env -f infra/docker-compose.yml up --build
#
# Persistence:
#   A single named volume (bsa_data) holds the LangGraph SQLite checkpoint
#   so reconciliation state survives container restarts.  No Postgres —
#   this is a single-tenant test deployment; SQLite + a volume is enough.

name: bsa

services:

  # --------------------------------------------------------------------------
  # api — FastAPI + LangGraph extraction service.
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # SQLite checkpoint store; persisted across container restarts.
      - bsa_data:/app/data
    environment:
      # Checkpointer — single SQLite file under the persisted volume.
      LANGGRAPH_CHECKPOINTER: sqlite
      LANGGRAPH_SQLITE_PATH: /app/data/graph.sqlite
      LANGGRAPH_STRICT_MSGPACK: "true"

      # Anthropic — required; supply via .env or shell (never commit secrets).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Azure Document Intelligence (preferred OCR engine — Tesseract fallback
      # when these are absent). See src/nodes/ingest.py:_pick_ocr_engine.
      AZURE_DI_ENDPOINT: ${AZURE_DI_ENDPOINT:-}
      AZURE_DI_KEY: ${AZURE_DI_KEY:-}

      # HITL threshold override. Set higher so the critic loop gets a chance
      # to re-extract problematic chunks before bailing to HITL (Binder2
      # produces ~17 suspects on first pass; default 3 skipped critic entirely).
      # Set to 0 to force any non-clean extraction into await_review for
      # testing the review modal flow.
      BSA_AWAIT_REVIEW_SUSPECTS: ${BSA_AWAIT_REVIEW_SUSPECTS:-25}

      # LangSmith — optional tracing; defaults to off.
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-bank-statement-analizer-dev}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}

      # CORS — allow the frontend container on port 80 by default.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
    healthcheck:
      # Single-line python -c — YAML folding + leading whitespace would
      # otherwise produce an IndentationError inside the container.
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=2).status==200 else 1)\""
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # frontend — Vite SPA served by nginx with /api/ reverse proxy to api.
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  bsa_data:
    name: bsa_data
