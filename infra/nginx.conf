# nginx configuration for the bank-statement-analizer frontend.
#
# Responsibilities:
#   1. Serve the Vite SPA from /usr/share/nginx/html.
#   2. Proxy /api/ → http://api:8000/ (strips the /api prefix).
#   3. Gzip compression for text assets.
#   4. Cache-control headers for hashed bundles vs. index.html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Gzip
    # ------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ------------------------------------------------------------------
    # /api/ → FastAPI backend (strips /api prefix).
    # The trailing slash on proxy_pass is intentional: nginx replaces the
    # matched location prefix with the proxy root, so /api/extract becomes
    # http://api:8000/extract.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large PDF uploads (matches FastAPI 80 MB limit; original
        # Ixonia Binder2_Redacted.pdf is ~54 MB).
        client_max_body_size 100m;

        # Disable buffering for streaming / long-running extractions.
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # SPA fallback — return index.html for any non-file route so that
    # React Router can handle client-side navigation.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Cache-control for hashed static assets (JS/CSS bundles from Vite).
    # Vite injects a content hash into filenames (e.g. index-a1b2c3.js),
    # so immutable caching is safe for these.
    # ------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # index.html must never be cached aggressively so browsers pick up
    # new deployments immediately.
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
